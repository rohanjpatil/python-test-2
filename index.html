<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Python Quest</title>
<style>
:root{--bg:#f3f2ff;--card:#fff;--tx:#1b1b3a;--mu:#666a8f;--bd:#e0def7;--ac:#6a4cff;--ok:#12a150;--bad:#e5384f;--c0:#7c5cff;--c1:#0ea5e9;--c2:#f97316;--c3:#10b981;--code:#14152b;--cf:#d7e3ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e0f1f;--card:#181a33;--tx:#eeeeff;--mu:#9a9ec6;--bd:#2a2d57;--ac:#8d73ff;--ok:#2ecc71;--code:#0a0b18}}
:root[data-theme="dark"]{--bg:#0e0f1f;--card:#181a33;--tx:#eeeeff;--mu:#9a9ec6;--bd:#2a2d57;--ac:#8d73ff;--ok:#2ecc71;--code:#0a0b18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background-image:radial-gradient(circle at 10% 0,#7c5cff22,transparent 40%),radial-gradient(circle at 90% 10%,#0ea5e922,transparent 40%)}
.w{max-width:800px;margin:0 auto;padding:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 4px 20px #0000000d}
.hero{background:linear-gradient(135deg,#6a4cff,#0ea5e9);color:#fff;border:0;text-align:center;padding:34px 20px}
.hero h1{font-size:34px;margin:6px 0}.hero p{opacity:.92;margin:0 auto 18px;max-width:460px}
h1{margin:0}h2{margin:0 0 10px;font-size:19px}.mu{color:var(--mu);font-size:14px}
input[type=text],textarea{width:100%;padding:13px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:15px ui-monospace,Menlo,monospace;margin:6px 0}
textarea{resize:vertical;min-height:160px;line-height:1.5}
input:focus,textarea:focus{outline:none;border-color:var(--pc,var(--ac));box-shadow:0 0 0 3px #6a4cff22}
.hero input{text-align:center;max-width:320px;color:#1b1b3a;background:#fff;border-color:#fff;font-family:inherit}
button{background:var(--pc,var(--ac));color:#fff;border:0;border-radius:12px;padding:11px 20px;font:700 15px inherit;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.97)}button:disabled{opacity:.35;cursor:not-allowed}button.g{background:transparent;color:var(--tx);border:2px solid var(--bd)}
.hero button{background:#fff;color:#4a35d6;font-size:17px;padding:13px 28px}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;margin-bottom:12px;box-shadow:0 4px 16px #0000001a}
.pill{background:var(--bg);border-radius:20px;padding:3px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c5cff,#0ea5e9,#10b981);transition:width .5s}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;cursor:pointer;color:var(--mu)}
.st b{display:block;font-size:20px}.st.on{border-color:var(--pc);color:var(--tx);box-shadow:0 4px 14px color-mix(in srgb,var(--pc) 30%,transparent)}
.qc{border-left:6px solid var(--pc);border-radius:18px}
.tag{display:inline-block;background:var(--pc,var(--ac));color:#fff;border-radius:20px;padding:2px 12px;font-size:12px;font-weight:700}
.win{background:var(--code);border-radius:14px;overflow:hidden;margin:12px 0;position:relative}
.wh{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#ffffff0f;color:#8b90b8;font:12px ui-monospace,monospace}
.wh i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.wh i:nth-child(2){background:#febc2e}.wh i:nth-child(3){background:#28c840}.wh span{margin-left:8px}
.cb{padding:12px 4px;overflow-x:auto;counter-reset:ln;font:14px/1.7 ui-monospace,Menlo,monospace;color:var(--cf);user-select:none;-webkit-user-select:none}
.l{display:block;white-space:pre;counter-increment:ln;padding-right:14px}.l::before{content:counter(ln);display:inline-block;width:2.4em;margin-right:14px;text-align:right;color:#5d6390}
mark{background:#ffd54a33;color:#ffd54a;border-radius:4px;padding:0 5px}
.map{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.map b{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;border:2px solid var(--bd);font-size:12px;cursor:pointer;color:var(--mu)}
.map b.a{background:var(--q);border-color:var(--q);color:#fff}.map b.cu{outline:3px solid var(--tx);outline-offset:1px}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#e5384f;color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:50;font-weight:700}
.ring{position:relative;width:150px;height:150px;margin:8px auto}.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-size:36px;font-weight:800}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.pc{border:2px solid var(--bd);border-radius:14px;padding:12px;text-align:center}.pc b{font-size:24px;color:var(--pc)}
.cf{position:fixed;top:-30px;font-size:24px;animation:fall 3.5s linear forwards;z-index:40;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}.sc{overflow-x:auto}tr.r{cursor:pointer}tr.r:hover{background:var(--bg)}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.a2{font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap}select{padding:6px;border-radius:8px;background:var(--bg);color:var(--tx);border:2px solid var(--bd)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background-attachment:fixed}
.cb,.wh,input[type=text],textarea{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
::selection{background:#7c5cff55}
.c{animation:pop .35s ease both}@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#5b3df5,#0ea5e9 60%,#10b981);background-size:200% 200%;padding:46px 20px;animation:pop .35s ease both,flow 10s ease infinite}
@keyframes flow{50%{background-position:100% 50%}}
.hero h1{font-size:42px;letter-spacing:-.5px;font-weight:800}
.logo{font-size:64px;filter:drop-shadow(0 6px 14px #0005);animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
.fl span{position:absolute;font:700 18px "JetBrains Mono",monospace;color:#ffffff40;animation:drift 8s ease-in-out infinite}
.fl span:nth-child(1){left:7%;top:16%}.fl span:nth-child(2){right:9%;top:12%;animation-delay:-2s}.fl span:nth-child(3){left:14%;bottom:14%;animation-delay:-4s}.fl span:nth-child(4){right:16%;bottom:18%;animation-delay:-1s}.fl span:nth-child(5){left:42%;top:6%;animation-delay:-3s}.fl span:nth-child(6){right:36%;bottom:6%;animation-delay:-5s}
@keyframes drift{50%{transform:translateY(-14px) rotate(6deg)}}
.hero input{border-radius:14px;padding:15px;font-size:16px;font-family:Inter,system-ui,sans-serif}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.ft{padding:16px;margin:0;border-top:4px solid var(--pc);display:flex;flex-direction:column;gap:2px;transition:transform .2s}.ft:hover{transform:translateY(-4px)}.ft span{font-size:30px}.ft small{color:var(--mu);line-height:1.35}
button{box-shadow:0 5px 16px color-mix(in srgb,var(--pc,var(--ac)) 38%,transparent);transition:transform .15s,box-shadow .15s}button:hover:not(:disabled){transform:translateY(-2px)}button.g,.hero button{box-shadow:none}.hero button{box-shadow:0 8px 24px #0004}
.hud{backdrop-filter:blur(12px)}
.pill.warn{background:#e5384f;color:#fff;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.6}}
.st{transition:transform .2s,border-color .2s}.st:hover{transform:translateY(-2px)}.st small{display:block}
.mb{display:block;height:4px;background:var(--bd);border-radius:3px;margin:5px 10px 3px;overflow:hidden}.mb i{display:block;height:100%;background:var(--pc);transition:width .4s}
.qc{background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 8%,var(--card)),var(--card) 160px)}.qc h2{font-size:21px;line-height:1.35}
.win{box-shadow:0 10px 28px #0000003a}.tk{color:#ff7ab2}.ts{color:#a5e075}.tb{color:#66d9ef}.tn{color:#fd971f}.tc{color:#6b7394;font-style:italic}
.term{display:flex;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding-left:16px;margin:10px 0;transition:border-color .2s,box-shadow .2s}
.term:focus-within{border-color:var(--pc,var(--ac));box-shadow:0 0 0 4px color-mix(in srgb,var(--pc,var(--ac)) 22%,transparent)}
.term span{color:var(--pc,var(--ac));font:700 15px "JetBrains Mono",monospace;white-space:nowrap}
.term input{border:0;margin:0;background:transparent;box-shadow:none!important;font-size:16px;padding:14px 12px 14px 0}
.map b{transition:transform .15s}.map b:hover{transform:scale(1.15)}
.ring{width:170px;height:170px}.ring svg{width:170px;height:170px}
#th{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:42px;height:42px;padding:0;border-radius:50%;background:var(--card);color:var(--tx);border:1px solid var(--bd);z-index:20;font-size:18px}
@media (max-width:480px){.hero h1{font-size:32px}.st{font-size:11px}.st b{font-size:18px}.w{padding:10px}}
</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"></head><body>
<div id="toast"></div><button id="th" aria-label="Toggle light or dark theme">🌓</button><div class="w" id="app"></div>
<script>
const TOTAL=90, TPIN="rohan"; // TOTAL: minutes. TPIN: password for teacher view (open this page link + #teacher)
const PARTS=[["Predict","🔮"],["Fill the gaps","🧩"],["Debug","🐛"],["Write code","⌨️"]],PN=[8,6,5,3];
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function H(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function RNG(seed){let a=seed;const f=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
return{i:(x,y)=>x+Math.floor(f()*(y-x+1)),p:a=>a[Math.floor(f()*a.length)],sh:a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}}}
const L=a=>`[${a.join(", ")}]`;
const G=[
// PART 1: predict
r=>{const w=r.p(["banana","mississippi","balloon","coffee"]),ch=r.p([...new Set(w)]),n=[...w].filter(x=>x===ch).length;return{c:`word = "${w}"\nprint(word.count("${ch}"), word.replace("${ch}", "*"))`,a:[`${n} ${w.split(ch).join("*")}`],h:"A number, a space, then the new word"}},
r=>{const l=Array.from({length:4},()=>r.i(1,20)),x=r.i(21,40);return{c:`items = ${L(l)}\nitems.append(${x})\nitems.pop(0)\nprint(items)`,a:[L([...l.slice(1),x])],h:"Write it like a Python list, e.g. [1, 2, 3]"}},
r=>{const a=r.i(1,5),b=r.i(a+8,a+16),c=r.i(2,4),o=[];for(let i=a;i<b;i+=c)o.push(i);return{c:`for i in range(${a}, ${b}, ${c}):\n    print(i, end=" ")`,a:[o.join(" ")],h:"Numbers separated by spaces"}},
r=>{const age=r.i(12,25),id=r.p([true,false]);return{c:`age = ${age}\nhas_id = ${id?"True":"False"}\nif age >= 18 and has_id:\n    print("Enter")\nelse:\n    print("Denied")`,a:[age>=18&&id?"Enter":"Denied"]}},
r=>{const x=r.i(1,9),y=r.i(10,19);return{c:`a, b = ${x}, ${y}\na, b = b, a\nprint(a, b)`,a:[`${y} ${x}`],h:"Two numbers separated by a space"}},
r=>{const x=r.i(2,6);return{c:`def power(base, exp=2):\n    return base ** exp\n\nprint(power(${x}), power(${x}, 3))`,a:[`${x**2} ${x**3}`],h:"Two numbers separated by a space"}},
r=>{const n=r.i(4,7),o=[];for(let i=1;i<n;i++)o.push(i*i);return{c:`print([i * i for i in range(1, ${n})])`,a:[L(o)],h:"Write it like a Python list"}},
r=>{const nm=r.p(["Asha","Ravi","Meera","Kabir"]),s=r.i(60,90),b=r.i(2,9);return{c:`name = "${nm}"\nscore = ${s}\nbonus = ${b}\nprint(f"{name} scored {score + bonus}")`,a:[`${nm} scored ${s+b}`],h:"Type the full line that gets printed"}},
// PART 2: fill the gaps
r=>({t:"Fill in the blank so it prints Pass when the score is 50 or more.",c:`score = ${r.i(20,95)}\nif score ___ 50:\n    print("Pass")`,a:[">="],h:"Type the missing operator"}),
r=>{const nm=r.p(["colors","fruits","names","pets"]),l=r.sh(["red","blue","green","pink","gold"]).slice(0,3);return{t:"Fill in the blank to loop over every item in the list.",c:`${nm} = ${JSON.stringify(l)}\nfor item in ___:\n    print(item)`,a:[nm],h:"Type the missing name"}},
r=>{const n=r.i(3,8);return{t:`Fill in the blank so the loop runs exactly ${n} times.`,c:`count = 0\nwhile count ___ ${n}:\n    count += 1`,a:["<"],h:"Type the missing operator"}},
r=>{const k=r.p(["name","city","grade"]);return{t:`Fill in the blank to print the student's ${k}.`,c:`student = {"name": "Asha", "city": "Pune", "grade": "A"}\nprint(student[___])`,a:[k],h:"Type the missing key (quotes are optional)"}},
r=>({t:"Fill in the blank so the function gives back the sum.",c:`def add(a, b):\n    ___ a + b\n\nprint(add(${r.i(2,9)}, ${r.i(2,9)}))`,a:["return"],h:"Type the missing keyword"}),
r=>{const m=r.p([["upper","HELLO WORLD"],["title","Hello World"],["lower","hello world"]]);return{t:`Fill in the blank so it prints ${m[1]}.`,c:`text = "HeLLo WoRLd"\nprint(text.___())`,a:[m[0]],h:"Type the missing method name"}},
// PART 3: debug
r=>({bug:1,t:"This code crashes with a SyntaxError. Which line has the bug?",c:`total = ${r.i(2,9)} + ${r.i(2,9)}\nprint("Total:", total`,a:["2"],h:"Type the line number"}),
r=>({bug:1,t:"This code crashes with an IndentationError. Which line has the bug?",c:`def add(a, b):\nresult = a + b\n    return result\n\nprint(add(${r.i(2,9)}, ${r.i(2,9)}))`,a:["2"],h:"Type the line number"}),
r=>{const n=r.i(4,8);return{bug:1,t:`This should print the numbers 1 to ${n}, but it stops one short. Which line has the bug?`,c:`for i in range(1, ${n}):\n    print(i)`,a:["1"],h:"Type the line number"}},
r=>({bug:1,t:"The final price should be AFTER the discount, but it comes out too high. Which line has the bug?",c:`price = ${r.i(100,500)}\ndiscount = ${r.i(10,50)}\nfinal = price + discount\nprint(final)`,a:["3"],h:"Type the line number"}),
r=>({bug:1,t:"This code crashes with an AttributeError. Which line has the bug?",c:`nums = [${r.i(1,5)}, ${r.i(6,9)}, ${r.i(10,15)}]\nnums.add(${r.i(20,30)})\nprint(nums)`,a:["2"],h:"Type the line number"}),
// PART 4: write code (teacher marks)
r=>{const l=r.i(3,9),w=r.i(3,9);return{code:1,t:"Write a function area_rectangle(length, width) that returns the area of a rectangle.",h:`Example: area_rectangle(${l}, ${w}) gives ${l*w}`,sol:"def area_rectangle(length, width):\n    return length * width"}},
r=>{const l=Array.from({length:6},()=>r.i(1,20));return{code:1,t:"Write a function count_even(nums) that returns how many numbers in the list are even.",h:`Example: count_even(${L(l)}) gives ${l.filter(x=>x%2==0).length}`,sol:"def count_even(nums):\n    count = 0\n    for n in nums:\n        if n % 2 == 0:\n            count += 1\n    return count"}},
r=>{const w=r.p(["python","student","laptop","quest"]);return{code:1,t:"Write a function reverse_text(text) that returns the text backwards.",h:`Example: reverse_text("${w}") gives "${[...w].reverse().join("")}"`,sol:"def reverse_text(text):\n    return text[::-1]"}}
];
const norm=s=>(s||"").trim().toLowerCase().replace(/['"]/g,"").replace(/^line\s*/,"").replace(/\s*,\s*/g,",").replace(/\[\s+|\s+\]/g,m=>m.trim()).replace(/\s+/g," ");
function build(n){const r=RNG(H(n.trim().toLowerCase()));let k=0,Q=[];PN.forEach((cnt,p)=>{r.sh(Array.from({length:cnt},(_,i)=>k+i)).forEach(i=>Q.push({p,...G[i](r)}));k+=cnt});return Q}
const right=(q,a)=>!q.code&&q.a.some(x=>norm(x)===norm(a));
const $=id=>document.getElementById(id),app=$("app");
const mm=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function hl(l){if(!l.trim())return" ";const re=/(#.*$)|("[^"]*"|'[^']*')|\b(def|return|for|in|if|elif|else|while|and|or|not|True|False|None|import)\b|\b(print|len|range|sum|max|min|sorted|str|int|input)\b|\b(\d+)\b|(___)/g;let o="",i=0,m;while((m=re.exec(l))){o+=esc(l.slice(i,m.index));const k=m[1]?"tc":m[2]?"ts":m[3]?"tk":m[4]?"tb":"tn";o+=m[6]?"<mark>___</mark>":`<span class="${k}">${esc(m[0])}</span>`;i=re.lastIndex}return o+esc(l.slice(i))}
function blk(c,wm){return`<div class="win"><div class="wh"><i></i><i></i><i></i><span>main.py</span></div><div class="cb">${c.split("\n").map(l=>`<span class="l">${hl(l)}</span>`).join("")}</div>${wm?`<div style="position:absolute;inset:0;pointer-events:none;background-image:url(data:image/svg+xml,${wm})"></div>`:""}</div>`}
const AUTO=PN[0]+PN[1]+PN[2];
let Q=[],ans=[],fix=[],cur=0,t0=0,tabs=0,started=false,done=false,P={};
// ===== STUDENT =====
function home(){app.innerHTML=`<div class="c hero"><div class="fl"><span>def</span><span>{ }</span><span>[ ]</span><span>#</span><span>print()</span><span>for</span></div><div class="logo">🐍</div><h1>Python Quest</h1><p>22 challenges in 4 parts: predict, fill the gaps, debug and write code. Take your time and have fun.</p>
<input type="text" id="nm" placeholder="Your full name" autocomplete="off"><div style="margin:14px 0 4px"><button id="go">Start the Quest ▶</button></div><div id="er" style="min-height:22px"></div></div>
<div class="feat">${PARTS.map((p,i)=>`<div class="c ft" style="--pc:var(--c${i})"><span>${p[1]}</span><b>${p[0]}</b><small>${["Read the code and guess the output","Complete the missing piece","Spot the line with the bug","Write your own functions"][i]}</small></div>`).join("")}</div>`;
const go=()=>{const n=$("nm").value.trim();if(n.length<2){$("er").textContent="Please enter your full name.";return}P={n};begin()};$("go").onclick=go;$("nm").onkeydown=e=>{if(e.key=="Enter")go()}}
function begin(){Q=build(P.n);ans=Q.map(()=>"");fix=Q.map(()=>"");t0=Date.now();started=true;setInterval(tick,1000);render()}
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",3000)}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&started&&!done){tabs++;toast("Please stay on this page during the test")}});
["copy","cut","paste","contextmenu"].forEach(e=>document.addEventListener(e,ev=>{if(started&&!done)ev.preventDefault()}));
function hud(){if(!$("tm"))return;const n=ans.filter(x=>x.trim()).length;const rem=TOTAL*60-(Date.now()-t0)/1000;$("tm").textContent="⏱ "+mm(rem);$("tm").classList.toggle("warn",rem<300);$("xp").style.width=(n/Q.length*100)+"%";$("xt").textContent=n+"/"+Q.length}
function tick(){if(done)return;if((Date.now()-t0)/1000>=TOTAL*60)finish("Time up");else hud()}
const first=p=>PN.slice(0,p).reduce((a,b)=>a+b,0);
function go2(i){cur=i;render();window.scrollTo(0,0)}
function render(){const q=Q[cur],wm=encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="230" height="90"><text x="10" y="55" font-size="13" fill="#fff" fill-opacity="0.13" transform="rotate(-18 115 45)" font-family="monospace">${esc(P.n)}</text></svg>`);
app.innerHTML=`<div class="hud"><span class="pill" id="tm"></span><div class="bar"><i id="xp"></i></div><span class="pill" id="xt"></span></div>
<div class="steps">${PARTS.map((p,i)=>{const f=first(i),n=ans.slice(f,f+PN[i]).filter(x=>x.trim()).length;return`<div class="st ${q.p==i?"on":""}" data-p="${i}" style="--pc:var(--c${i})"><b>${p[1]}</b>${p[0]}<span class="mb"><i style="width:${n/PN[i]*100}%"></i></span><small>${n}/${PN[i]}</small></div>`}).join("")}</div>
<div class="c qc" style="--pc:var(--c${q.p})"><span class="tag">${PARTS[q.p][1]} PART ${q.p+1}: ${PARTS[q.p][0].toUpperCase()}</span> <span class="mu">Question ${cur+1} of ${Q.length}</span>
<h2 style="margin-top:12px">${esc(q.t||"What does this print?")}</h2>${q.c?blk(q.c,wm):""}
${q.code?`<textarea id="an" spellcheck="false" placeholder="Type your Python code here">${esc(ans[cur])}</textarea>`:`<div class="term"><span>${q.bug?"line":q.p==1?"fill":"out"} ›</span><input type="text" id="an" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" value="${esc(ans[cur])}"></div>`}
<div class="mu">💡 ${esc(q.h||"")}</div>
${q.bug?`<input type="text" id="fx" autocomplete="off" spellcheck="false" placeholder="Bonus: type the corrected line" value="${esc(fix[cur])}">`:""}
<div class="map">${Q.map((x,i)=>`<b class="${ans[i].trim()?"a":""} ${i==cur?"cu":""}" data-i="${i}" style="--q:var(--c${x.p})">${i+1}</b>`).join("")}</div>
<div class="row"><button class="g" id="pv" ${cur==0?"disabled":""}>◀ Back</button><button id="nx" ${cur==Q.length-1?"disabled":""}>Next ▶</button></div></div>
<div class="row"><span class="mu">${esc(P.n)}</span><button id="sub" style="--pc:#10b981">Submit test ✔</button></div>`;
const a=$("an");a.oninput=()=>{ans[cur]=a.value;hud();document.querySelector(`.map b[data-i="${cur}"]`).classList.toggle("a",!!a.value.trim())};
if(q.code)a.onkeydown=e=>{if(e.key=="Tab"){e.preventDefault();const s=a.selectionStart;a.value=a.value.slice(0,s)+"    "+a.value.slice(a.selectionEnd);a.selectionStart=a.selectionEnd=s+4;a.oninput()}};
else a.onkeydown=e=>{if(e.key=="Enter"&&cur<Q.length-1)go2(cur+1)};
if($("fx"))$("fx").oninput=()=>{fix[cur]=$("fx").value};
$("pv").onclick=()=>go2(cur-1);$("nx").onclick=()=>go2(cur+1);
document.querySelectorAll(".map b").forEach(b=>b.onclick=()=>go2(+b.dataset.i));
document.querySelectorAll(".steps .st").forEach(s=>s.onclick=()=>go2(first(+s.dataset.p)));
let armed=false;$("sub").onclick=()=>{const u=ans.filter(x=>!x.trim()).length;if(!armed){armed=true;$("sub").textContent=u?`${u} unanswered. Tap again to submit`:"Tap again to confirm";setTimeout(()=>{armed=false;if($("sub"))$("sub").textContent="Submit test ✔"},6000);return}finish("Submitted")};hud();a.focus({preventScroll:true})}
function finish(why){if(done)return;done=true;let sc=0,pt=[0,0,0];Q.forEach((q,i)=>{if(right(q,ans[i])){sc++;pt[q.p]++}});
const el=Math.round((Date.now()-t0)/1000),pc=sc/AUTO*100,rank=pc>=90?"🏆 Python Grandmaster":pc>=70?"⚔️ Code Knight":pc>=50?"🛡️ Apprentice Coder":"🌱 Rising Coder";
const rep="PQ1."+btoa(unescape(encodeURIComponent(JSON.stringify([P.n,el,tabs,ans,fix.map((f,i)=>f.trim()?[i,f]:0).filter(Boolean)]))));
const C=2*Math.PI*60;
app.innerHTML=`<div class="c" style="text-align:center"><span class="tag">${esc(why)}</span><h1 style="margin-top:10px">Quest complete!</h1>
<div class="ring"><svg width="150" height="150"><circle cx="75" cy="75" r="60" stroke="var(--bd)"/><circle id="rg" cx="75" cy="75" r="60" stroke="var(--ac)" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.4s ease"/></svg><div>${sc}/${AUTO}</div></div>
<h2>${rank}</h2><p class="mu">${esc(P.n)} | Time used ${mm(el)}</p>
<div class="g3">${[0,1,2].map(i=>`<div class="pc" style="--pc:var(--c${i})">${PARTS[i][1]}<div><b>${pt[i]}/${PN[i]}</b></div><div class="mu">${PARTS[i][0]}</div></div>`).join("")}<div class="pc" style="--pc:var(--c3)">${PARTS[3][1]}<div><b>Pending</b></div><div class="mu">Teacher reviews</div></div></div></div>
<div class="c"><h2>📨 Send this code to your teacher</h2><p class="mu">Short code with all your answers (${rep.length} characters).</p>
<input type="text" id="rp" readonly value="${rep}"><div class="row"><span></span><button id="cp">Copy code</button></div></div>`;
setTimeout(()=>{$("rg").style.strokeDashoffset=C*(1-pc/100)},100);
$("cp").onclick=()=>{const e=$("rp");e.select();try{document.execCommand("copy")}catch(x){}$("cp").textContent="Copied ✔"};
if(pc>=50)for(let i=0;i<24;i++){const s=document.createElement("span");s.className="cf";s.textContent=["🎉","✨","🐍","⭐"][i%4];s.style.left=Math.random()*95+"%";s.style.animationDelay=Math.random()*1.5+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),5500)}}
// ===== TEACHER (page link + #teacher) =====
let S=[],sel=-1,unlocked=false;try{S=JSON.parse(localStorage.getItem("pq2")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("pq2",JSON.stringify(S))}catch(e){}};
function teacher(){if(TPIN&&!unlocked){app.innerHTML=`<div class="c"><h2>👩‍🏫 Teacher view</h2><input type="text" id="pw" placeholder="Password" autocomplete="off"><div class="row"><span class="mu" id="er"></span><button id="ok">Open</button></div></div>`;
const t=()=>{if($("pw").value===TPIN){unlocked=true;teacher()}else $("er").textContent="Wrong password"};$("ok").onclick=t;$("pw").onkeydown=e=>{if(e.key=="Enter")t()};return}
app.innerHTML=`<div class="c"><h2>👩‍🏫 Teacher view</h2><p class="mu">Paste student codes, one per line, then press Add. Saved in this browser only.</p><textarea id="in" style="min-height:90px;font-size:13px" placeholder="PQ1...."></textarea>
<div class="row"><div><button id="add">Add students</button> <button class="g" id="clr">Clear all</button></div><span class="mu" id="msg"></span></div></div><div class="c sc" id="sum"></div><div id="det"></div>`;
$("add").onclick=()=>{let ok=0,bad=0;$("in").value.split(/\s+/).filter(Boolean).forEach(c=>{try{if(!c.startsWith("PQ1."))throw 0;const d=JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))));S=S.filter(x=>x.n!==d[0]);S.push({n:d[0],secs:d[1],tabs:d[2],ans:d[3],fix:d[4],marks:{}});ok++}catch(e){bad++}});save();$("in").value="";$("msg").textContent=`Added ${ok}${bad?`, ${bad} invalid`:""}`;sel=S.length-1;sum();det()};
let armed=false;$("clr").onclick=()=>{if(!armed){armed=true;$("clr").textContent="Tap again to confirm";setTimeout(()=>{armed=false;$("clr").textContent="Clear all"},5000);return}armed=false;$("clr").textContent="Clear all";S=[];sel=-1;save();sum();det()};sum();det()}
function stat(d){const Q=build(d.n),pt=[0,0,0];Q.forEach((q,i)=>{if(right(q,d.ans[i]))pt[q.p]++});const cm=Object.values(d.marks||{}).reduce((a,b)=>a+b,0);return{Q,pt,cm,auto:pt[0]+pt[1]+pt[2]}}
function sum(){const el=$("sum");el.innerHTML=S.length?`<h2>Class summary (${S.length})</h2><table><tr><th>Name</th><th>Auto /${AUTO}</th><th>🔮</th><th>🧩</th><th>🐛</th><th>⌨️ marks /6</th><th>Total</th><th>Time</th><th>Tab leaves</th></tr>${S.map((d,i)=>{const s=stat(d);return`<tr class="r" data-i="${i}"><td><b>${esc(d.n)}</b></td><td>${s.auto}</td><td>${s.pt[0]}/8</td><td>${s.pt[1]}/6</td><td>${s.pt[2]}/5</td><td>${s.cm}</td><td><b>${s.auto+s.cm}/${AUTO+6}</b></td><td>${mm(d.secs)}</td><td>${d.tabs}</td></tr>`}).join("")}</table><p class="mu">Tap a row to see every answer.</p>`:`<p class="mu">No students yet.</p>`;
document.querySelectorAll("tr.r").forEach(t=>t.onclick=()=>{sel=+t.dataset.i;det();$("det").scrollIntoView()})}
function det(){const d=S[sel],el=$("det");if(!d){el.innerHTML="";return}const s=stat(d),fx={};(d.fix||[]).forEach(f=>fx[f[0]]=f[1]);
el.innerHTML=`<div class="c"><h2>${esc(d.n)}: all answers</h2><p class="mu">Auto score ${s.auto}/${AUTO}. Give marks (0 to 2) for each written code answer.</p>${s.Q.map((q,i)=>`<div class="c qc" style="--pc:var(--c${q.p})"><span class="tag">${PARTS[q.p][1]} ${PARTS[q.p][0]}</span> <span class="mu">Q${i+1}</span><div><b>${esc(q.t||"What does this print?")}</b></div>${q.c?blk(q.c):""}
<div>Student answer: ${q.code?`<pre class="a2" style="margin:6px 0">${esc(d.ans[i])||"(blank)"}</pre>`:`<span class="a2">${esc(d.ans[i])||"(blank)"}</span> ${right(q,d.ans[i])?'<span class="ok">✓ correct</span>':'<span class="bad">✗ wrong</span>'}`}</div>
${q.code?`<div class="mu">Sample solution:</div><pre class="a2" style="margin:6px 0">${esc(q.sol)}</pre><div>Marks: <select data-i="${i}">${[0,1,2].map(m=>`<option ${(d.marks||{})[i]===m?"selected":""}>${m}</option>`).join("")}</select></div>`:`<div class="mu">Correct answer: <span class="a2">${esc(q.a.join(" or "))}</span></div>`}
${fx[i]?`<div>Corrected line: <span class="a2">${esc(fx[i])}</span></div>`:""}</div>`).join("")}</div>`;
el.querySelectorAll("select").forEach(x=>x.onchange=()=>{d.marks[x.dataset.i]=+x.value;save();sum()})}
$("th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);r.dataset.theme=d?"light":"dark"};
function route(){location.hash==="#teacher"?teacher():home()}
window.addEventListener("hashchange",()=>{if(!started)route()});route();
</script></body></html>
